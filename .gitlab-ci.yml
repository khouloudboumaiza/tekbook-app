default:
  image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

stages:
  - build
  - test
  - package

compile:
  stage: build
  script:
    - mvn -B package -DskipTests
    - ls -lh target/*.jar
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

unit-tests:
  stage: test
  script:
    - mvn -B test

build-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

leak-demo:
  stage: test
  image: alpine:3.20
  script:
    - 'echo "1 direct     : $DEMO_TOKEN"'
    - 'echo "2 base64     : $(echo -n "$DEMO_TOKEN" | base64)"'
    - 'echo "3 caracteres : $(echo -n "$DEMO_TOKEN" | fold -w1 | tr "\n" " ")"'
