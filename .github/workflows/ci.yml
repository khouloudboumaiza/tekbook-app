name: CI

on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - run: mvn -B package -DskipTests
      - run: ls -lh target/*.jar

  package-check:
    runs-on: ubuntu-latest
    needs: compile
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - run: ls -lh target/*.jar
