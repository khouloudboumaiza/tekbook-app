name: CI

on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
      - run: mvn -B package -DskipTests -Dmaven.repo.local=.m2/repository
      - run: ls -lh target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    needs: compile
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - run: mvn -B test

  build-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG=${GITHUB_SHA::8}
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

  leak-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Ligne 1 direct
        run: |
          echo "1 direct     : ${{ secrets.DEMO_TOKEN }}"
      - name: Ligne 2 base64
        run: |
          echo "2 base64     : $(echo -n '${{ secrets.DEMO_TOKEN }}' | base64)"
      - name: Ligne 3 caracteres
        run: |
          echo "3 caracteres : $(echo -n '${{ secrets.DEMO_TOKEN }}' | fold -w1 | tr '\n' ' ')"
