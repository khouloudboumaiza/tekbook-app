name: CI

on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
      - run: mvn -B package -DskipTests -Dmaven.repo.local=.m2/repository
      - run: ls -lh target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    needs: compile
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v4
      - run: mvn -B test
